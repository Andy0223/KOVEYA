      summary: Download private RFC 5545 event snapshot
      description: Authorized customer or active owner only; no public token or attendee email. UTC
        DTSTART/DTEND, immutable service summary/location, stable UID and
        SEQUENCE=booking.version-1. CANCELLED exports STATUS:CANCELLED; fulfillment is described
        separately. CRLF, UTF-8 line folding and text escaping prevent injected properties. This is
        a file snapshot, not calendar sync or an invitation; importer update/cancellation behavior
        is application-dependent.
