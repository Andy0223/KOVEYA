  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-koveya_session
      description: HTTPS uses the __Host- prefix with Secure, HttpOnly, SameSite=Lax and Path=/. Local
        HTTP uses koveya_session.
    loginChallenge:
      type: apiKey
      in: cookie
      name: __Host-koveya_login
      description: Browser-binding cookie for one-time email verification. Local HTTP uses koveya_login.
