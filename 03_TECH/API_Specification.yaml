    get:
      operationId: getNotifications
      summary: Read own in-app notifications and unread count
      description: Latest 100, newest first. Performs bounded maintenance to support local development;
        scheduled Worker also runs every five minutes. Recipient IDs derive from authorized domain
        relationships. No cross-user notification data is returned. Email delivery is not
