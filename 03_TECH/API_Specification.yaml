    PublicProvider:
      type: object
      additionalProperties: false
      required:
        - publicName
        - slug
        - bio
        - locationLabel
        - timezone
        - services
      properties:
        publicName:
          type: string
        slug:
          type: string
        bio:
          type: string
        locationLabel:
          type: string
        timezone:
          type: string
          examples:
            - Asia/Taipei
        services:
          type: array
          items:
            $ref: "#/components/schemas/PublicService"
    PublicService:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - description
        - mode
        - delivery
        - locationLabel
        - timezone
        - cancellationPolicy
        - offerings
        - revision
        - cancellationNoticeMinutes
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        mode:
          enum:
            - INSTANT
            - REQUEST
        delivery:
          enum:
            - ONLINE
            - IN_PERSON
            - AT_CLIENT
        locationLabel:
          type: string
        timezone:
          type: string
        cancellationPolicy:
          type: string
        offerings:
          type: array
          items:
