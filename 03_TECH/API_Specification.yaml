x-koveya-scheduling-contract-note: Shared GET/PUT /business/availability replaces proposed
  per-service availability-rules and availability-exceptions endpoints for the one-resource MVP.
x-koveya-background-processing:
  - Scheduled Worker every five minutes; local GET /notifications also runs bounded maintenance.
  - At most five request expirations and ten outbox events per invocation. Expiry is already
    enforced on reads and mutations.
  - In-app notification insertion and Outbox SENT marking commit atomically with unique
    event/recipient deduplication. SENT means in-app processing only, not email delivery.
  - Failed notification delivery increments attempts, retains a safe error category, retries
    exponentially from 30 seconds, then becomes FAILED after five attempts. Manual administration
    remains pending.
