        revision:
          type: integer
          minimum: 1
        cancellationNoticeMinutes:
          type: integer
          minimum: 0
    PublicOffering:
      type: object
      additionalProperties: false
      required:
        - id
        - durationMinutes
        - pricingType
        - priceMinor
        - currency
      properties:
        id:
          type: string
        durationMinutes:
          type: integer
          minimum: 15
          multipleOf: 15
        pricingType:
          enum:
            - FIXED
            - FREE
            - QUOTE
        priceMinor:
          type:
            - integer
            - "null"
          minimum: 0
        currency:
          type: string
          pattern: ^[A-Z]{3}$
