x-koveya-write-requirements:
  - Server-side identity, tenant scope, permissions, state and policy checks
  - Input validation and rate limiting before external side effects
  - Idempotency-Key for important transactional side effects
  - Request hash conflict if the same key is reused for different input
  - Origin and CSRF protection when cookie authentication is introduced
  - Database constraints and atomic booking, allocation, history and outbox writes
